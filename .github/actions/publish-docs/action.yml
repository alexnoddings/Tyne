name: "Publish docs"
description: "Publishes the docs/example site"
runs:
  using: "composite"
  steps:
    - name: Setup pages
      uses: actions/configure-pages@v5

    - name: Upload docs artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./artifacts/docs/

    - name: Deploy to Pages
      id: deploy-pages
      uses: actions/deploy-pages@v4
      with:
        timeout: 30000
